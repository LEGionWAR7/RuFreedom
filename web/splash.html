<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RuFreedom</title>
<style>
  :root{
    --bg:#0a0e17; --card:#0f1523; --edge:#1c2740; --mut:#7b8aa6;
    --cyan:#22d3ee; --accent:#4f8cff; --accent2:#7c5cff;
    --e:cubic-bezier(.22,.61,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg); color:#e9eef7;
    font:14px/1.45 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    display:grid; place-items:center; user-select:none; cursor:default;
    -webkit-user-select:none;
  }
  .wrap{
    width:100%; height:100%; padding:26px 28px;
    display:flex; flex-direction:column; justify-content:center; gap:18px;
    background:
      radial-gradient(120% 90% at 12% 0%, rgba(79,140,255,.16), transparent 62%),
      radial-gradient(120% 90% at 100% 100%, rgba(124,92,255,.14), transparent 60%),
      var(--card);
    border:1px solid var(--edge); border-radius:18px;
  }
  .row{display:flex;align-items:center;gap:14px}
  .logo{
    width:54px;height:54px;flex:none;display:block;object-fit:contain;
    filter:drop-shadow(0 6px 20px rgba(254,198,2,.35));
    animation:pulse 2.4s var(--e) infinite;
  }
  h1{font-size:22px;font-weight:800;letter-spacing:.2px}
  .sub{color:var(--mut);font-size:12.5px;margin-top:2px}

  .bar{height:6px;border-radius:999px;background:#131c2e;overflow:hidden;position:relative}
  /* Заполнение тянем через scaleX: это делает видеокарта, полоса едет ровно
     даже когда питон занят проверкой хостов и главному потоку не до нас. */
  .bar i{
    position:absolute;inset:0;border-radius:999px;transform-origin:left center;
    background:linear-gradient(90deg,var(--cyan),var(--accent),var(--accent2));
    transform:scaleX(0);
    /* Сглаживание между шагами отдано CSS: его крутит композитор, и полоса
       едет ровно даже когда главному потоку не до анимации. */
    transition:transform .16s linear;
  }
  /* Блик бежит поверх заполненной части — она живая, даже когда стоит */
  .bar u{
    position:absolute;inset:0;border-radius:999px;text-decoration:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
    width:38%; transform:translateX(-120%);
    animation:shine 1.35s var(--e) infinite;
  }
  .foot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:9px}
  .msg{
    color:var(--mut);font-size:12.5px;min-height:18px;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:opacity .18s;
  }
  .msg.sw{opacity:0}
  .pct{
    font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;flex:none;
    background:linear-gradient(90deg,var(--cyan),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  @keyframes shine{
    0%{transform:translateX(-120%)}
    100%{transform:translateX(360%)}
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
  }
  @media (prefers-reduced-motion: reduce){
    .logo{animation:none}
    .bar u{animation:none;opacity:0}
    .bar i{transition:none}
  }
</style>
</head>

<script>
(function () {
  var fill = document.getElementById("fill");
  var msgEl = document.getElementById("msg");
  var pctEl = document.getElementById("pct");

  var real = 0;      // сколько сказал питон
  var drift = 0;     // самоход: пока питон молчит, полоса всё равно едет
  var shown = 0;     // что нарисовано сейчас
  var slow = window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Шаги считаем по таймеру, а НЕ по requestAnimationFrame. Кадры анимации
  // браузер не выдаёт, пока окно не композитится (свёрнуто, перекрыто,
  // ещё не показано) -- на rAF полоса в такие моменты просто замирает.
  // Таймер идёт всегда, а плавность между шагами делает CSS-переход.
  var STEP = 60;              // мс
  var EASE = 0.22;            // доля оставшегося пути за шаг
  var DRIFT_MAX = 7;          // насколько самоход вправе обогнать веху
  var DRIFT_PER_SEC = 3.2;

  function goal() {
    if (real >= 100) return 100;
    // до сотни самоход не доходит НИКОГДА: 100% ставится только по факту
    return Math.min(real + drift, 99);
  }

  function step() {
    if (real < 100) drift = Math.min(DRIFT_MAX, drift + DRIFT_PER_SEC * STEP / 1000);
    var g = goal();
    // На финише доезжаем вдвое быстрее: окно открывается почти сразу после
    // «Готово», и полоса обязана успеть добежать, а не замереть на 99.
    shown += (g - shown) * (real >= 100 ? 0.5 : EASE);
    if (g - shown < 0.2) shown = g;
    fill.style.transform = "scaleX(" + (shown / 100).toFixed(4) + ")";
    pctEl.textContent = Math.round(shown) + "%";
  }
  step();
  setInterval(step, STEP);

  // Питон зовёт это, чтобы показать, чем сейчас занят.
  window.rzSay = function (text) {
    if (!msgEl || msgEl.textContent === text) return;
    if (slow) { msgEl.textContent = text; return; }
    msgEl.classList.add("sw");
    setTimeout(function () {
      msgEl.textContent = text;
      msgEl.classList.remove("sw");
    }, 160);
  };

  // ...а это -- насколько продвинулся. Назад полоса не ходит: съехавший
  // процент выглядит как поломка, даже когда работа честно идёт вперёд.
  window.rzProgress = function (pct, text) {
    pct = Math.max(0, Math.min(100, Number(pct) || 0));
    if (pct >= real) { real = pct; drift = 0; }
    if (text) window.rzSay(text);
    step();                   // отзыв мгновенный, не через 60 мс
  };
})();
</script>
</body>
</html>
