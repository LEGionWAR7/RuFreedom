[ruszapret]
# Порты, на которых перехватываем исходящий трафик
ports = 80, 443

# Техника десинхронизации DPI:
#   split         — разрезать первый пакет на 2 части
#   disorder      — то же + обратный порядок частей (надёжнее)
#   fake          — добавить фальшивый сегмент (см. fooling ниже)
#   fakedisorder  — fake + обратный порядок (сильно против умного DPI)
#   multisplit    — разрезать на 3 части
#   multidisorder — 3 части в обратном порядке
strategy = disorder

# Способ «обмана» фальшивого сегмента (для fake / fakedisorder):
#   ttl    — низкий TTL: пакет не доходит до сервера (по умолчанию)
#   badsum — неверная TCP-чексумма: сервер отбрасывает пакет
#   none   — обычный фальшивый сегмент
fooling = ttl

# Где резать имя хоста внутри пакета:
#   first-char — сразу после первого символа имени (по умолчанию)
#   mid-host   — посередине имени
#   host-start — перед именем
#   host-end   — после имени
split_mode = first-char

# TTL фальшивого пакета (для strategy = fake и quic_mode = fake).
# Должен быть меньше числа хопов до сервера, но больше, чем до DPI провайдера.
# Подбирается опытным путём: обычно 3-8.
fake_ttl = 4

# Обработка QUIC (HTTP/3 поверх UDP/443):
#   drop   — гасить QUIC Initial -> откат на TCP/TLS (надёжно, по умолчанию)
#   ipfrag — разбить QUIC Initial на два IP-фрагмента (DPI не видит SNI)
#   fake   — слать фальшивый UDP-пакет с низким TTL перед реальным
#   off    — не трогать QUIC
quic_mode = drop

# Список доменов, к которым применять обход. Если оставить пустым —
# обход работает для ВСЕГО TLS/HTTP-трафика.
# Путь относительный (от папки config) или абсолютный.
hostlist_path = hostlist.txt
